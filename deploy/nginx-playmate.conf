# 陪玩平台反向代理（由 systemd 托管 Go API 与 Next.js Web）
# 放置于 /www/server/panel/vhost/nginx/playmate.zorazora.cn.conf

limit_req_zone $binary_remote_addr zone=playmate_auth:10m rate=10r/m;

upstream playmate_web {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream playmate_api {
    server 127.0.0.1:8090;
    keepalive 32;
}

# 域名 HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name playmate.zorazora.cn;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/playmate.zorazora.cn;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 域名 HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name playmate.zorazora.cn;

    ssl_certificate     /www/server/panel/vhost/cert/www.zorazora.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.zorazora.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:playmate_ssl:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /www/wwwlogs/playmate.access.log;
    error_log /www/wwwlogs/playmate.error.log warn;

    client_max_body_size 2m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    include /www/wwwroot/playmate.zorazora.cn/nginx-locations.inc;
}

# 公网 IP 直达（用于部署验证；正式入口使用域名 HTTPS）
server {
    listen 80;
    server_name 59.110.232.243;

    access_log /www/wwwlogs/playmate.access.log;
    error_log /www/wwwlogs/playmate.error.log warn;

    client_max_body_size 2m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    include /www/wwwroot/playmate.zorazora.cn/nginx-locations.inc;
}
